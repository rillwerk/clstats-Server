# Placeholder only. Better: delete this file from kustomization.yaml and create the secret
# without writing the token into a file:
#
#   kubectl create namespace clstats
#   kubectl -n clstats create secret generic clstats \
#     --from-literal=API_TOKEN="$(openssl rand -hex 32)"
#
# The placeholder below is deliberately too short (API_TOKEN needs at least 24 characters),
# so the server refuses to start until you set a real token.
apiVersion: v1
kind: Secret
metadata:
  name: clstats
  namespace: clstats
type: Opaque
stringData:
  API_TOKEN: "CHANGE-ME"
  # Optional: key that encrypts the stored claude.ai cookie. If not set, the server generates
  # one on first start and keeps it on the volume (/data/secret.key).
  # Generate: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # SECRET_KEY: ""
