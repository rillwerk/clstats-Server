apiVersion: apps/v1
kind: Deployment
metadata:
  name: clstats
  namespace: clstats
  labels:
    app.kubernetes.io/name: clstats-server
spec:
  # Exactly one replica: the server keeps its data in SQLite and polls claude.ai itself.
  # Recreate stops the old pod before the new one starts, so two pods never share the volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clstats-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clstats-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image runs as uid 99 / gid 100; fsGroup makes the volume writable for it.
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clstats
          image: ghcr.io/rillwerk/clstats-server:1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: clstats
          env:
            - name: TZ
              value: "UTC"          # time zone for daily statistics, e.g. Europe/Berlin
            - name: POLL_INTERVAL
              value: "300"          # seconds between polls, minimum 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp            # writable /tmp for SQLite and Python, root fs stays read-only
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clstats-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
