## SWAG proxy config: copy to /config/nginx/proxy-confs/clstats.subdomain.conf and adjust server_name.
## The API is protected by its own bearer token, so it bypasses Authelia
## (the iPhone app and widgets cannot do an Authelia login). /privacy is public too.
## The web dashboard at / can sit behind Authelia if you like.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name clstats.*;

    include /config/nginx/ssl.conf;

    # The token script sends all rows still in Claude Code's logs (about 15 KB per day of use),
    # which outgrows 1m with heavy use; the server itself refuses bodies over 16 MB.
    client_max_body_size 10m;

    # Uncomment to put the dashboard behind Authelia:
    # include /config/nginx/authelia-server.conf;

    location / {
        # include /config/nginx/authelia-location.conf;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app clstats;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Public privacy policy for the App Store listing, also without Authelia.
    location = /privacy {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app clstats;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app clstats;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
